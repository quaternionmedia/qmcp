# What the spoken loop listens for, and what each phrase does.
#
# Read by `qmcp.integrations.voice.vocabulary`. Phrases are compared lower-case
# with punctuation and apostrophes gone ("that's all" is "thats all"). How a
# list is matched is its reader's: a whole utterance, a word anywhere in it, or
# a phrase inside it. `says` is what `qmcp vocabulary` and joe's page show.

# --- the conversation's own controls: matched on the whole utterance -------------

[conversation.stop]
says = "End the conversation"
phrases = ["stop", "stop listening", "goodbye", "good bye", "stop the conversation", "stop talking",
           "end the conversation", "bye", "good night", "goodnight", "quit", "stop now"]

[conversation.repeat]
says = "Say the last question again"
phrases = ["repeat", "repeat that", "say that again", "come again", "pardon", "what",
           "what was that", "sorry", "say again", "what did you say", "can you repeat that",
           "could you repeat that", "i didnt catch that", "huh"]

[conversation.done]
says = "Nothing more for now: go back to waiting"
phrases = ["no", "nope", "nothing", "no thanks", "no thank you", "thats all", "that is all",
           "nothing else", "not now", "thats it", "no more", "all done", "im done", "nothing more",
           "not right now", "thats everything", "nah", "no thats all", "no thats it"]

[conversation.more]
says = "Ask for the next instruction now"
phrases = ["yes", "yeah", "yep", "sure", "yes please", "please", "one more", "another one",
           "go on", "next", "keep going", "yes one more", "yeah one more"]

# --- answers to a closed question --------------------------------------------------

[answer.yes]
says = "Yes, to a question with a yes in it -- approve, agree"
words = ["yes", "yeah", "yep", "yup", "sure", "affirmative", "correct", "approve", "approved",
         "confirm", "confirmed"]
phrases = ["go ahead", "do it", "sounds good", "go for it", "please do", "make it so",
           "carry on", "lets do it"]

[answer.no]
says = "No, to a question with a no in it -- hold, again"
words = ["no", "nope", "nah", "negative", "reject", "rejected", "deny", "denied", "stop", "cancel"]
phrases = ["do not", "dont", "hold off", "not now", "not yet", "hold on", "hang on", "leave it",
           "not today", "never mind", "forget it"]

[answer.unclear]
says = "Neither: the question is asked again"
phrases = ["not sure", "not certain", "dont know", "maybe", "let me think"]

[answer.agree]
says = "Record the instruction read back; the first is the option offered"
phrases = ["agree", "record", "thats right", "exactly", "spot on"]

[answer.again]
says = "Take the instruction read back again"
phrases = ["again", "start again", "redo"]

# --- iteration: the last instruction again, or nothing at all; the whole utterance --

[iteration.try_again]
says = "The last instruction again, recorded anew and asked for consent"
phrases = ["try again", "again", "once more", "run that again", "do that again", "again please",
           "one more time", "redo that", "same again", "repeat the last instruction"]

[iteration.same_in]
says = "The last instruction again, for the project named"
phrases = ["same in {project}", "same for {project}", "the same in {project}",
           "same thing in {project}", "do that in {project}", "again in {project}",
           "now in {project}", "and in {project}"]

[iteration.never_mind]
says = "Drop what is being asked: nothing is recorded"
phrases = ["never mind", "nevermind", "cancel", "cancel that", "forget it", "forget that",
           "scrap that"]

# --- diagnostics: the loop says how it stands; the whole utterance -----------------

[diagnostic.what_heard]
says = "Say what was heard last"
phrases = ["what did you hear", "what did i say", "read that back", "what did you get",
           "what was the last thing i said"]

[diagnostic.how_did_it_go]
says = "Say again how the last instruction ended"
phrases = ["how did that go", "how did it go", "what happened", "did it work",
           "what was the result", "say the result again"]

[diagnostic.whats_waiting]
says = "Say how many questions are waiting"
phrases = ["whats waiting", "what is waiting", "anything waiting", "is anything waiting",
           "any questions", "whats on the queue"]

[diagnostic.test_voice]
says = "Check both ways: it answers that it can hear"
phrases = ["test the voice", "voice check", "can you hear me", "testing", "mic check",
           "microphone check", "are you there"]

[diagnostic.which_projects]
says = "Say which projects it knows"
phrases = ["which projects", "which projects do you know", "what projects do you know",
           "list the projects"]

[diagnostic.help]
says = "Say what can be said"
phrases = ["help", "what can i say", "what can you do", "what are my options"]

# --- the core projects: the words their instructions carry ---------------------------
# `terms` are shown with what can be said. They reach the transcriber with an
# instruction's take only when `QMCP_VOICE_HINT_TERMS` is set: on synthesized
# speech they helped the jargon be heard, and on the first real takes they lowered
# whisper's confidence and lost one take's words.
#
# `checks` are the project's own commands an instruction can run by voice: one
# whose words contain a check's phrase, recorded for the project, runs `argv` in
# the project's clone behind a consent, as any act does. `argv` is fixed here;
# nothing heard is ever added to it. Each is chosen to leave the clone as it was
# -- nothing tracked is written -- and to finish within `minutes`. The line said
# back is the last one the command printed, or the last matching `said`, a
# regular expression, where the last line is not the one that answers.

[projects.qmcp]
says = "The harness: the human queue, the instructions, the spoken loop"
terms = ["qmcp", "preflight", "cookbook", "converse", "consent", "runtime", "roadmap", "vocabulary"]

[[projects.qmcp.checks]]
name = "tests"
says = "The test suite"
phrases = ["run the tests", "run the test suite", "run the suite", "test it"]
argv = ["uv", "run", "--frozen", "--all-extras", "pytest", "-q", "-p", "no:cacheprovider"]
minutes = 10

[[projects.qmcp.checks]]
name = "offline"
says = "The spoken loop's offline check, every take scripted"
phrases = ["run the offline check", "run the cookbook", "check the loop"]
argv = ["uv", "run", "--frozen", "qmcp", "cookbook", "converse"]
minutes = 5

[projects.joe]
says = "The speech engine and the visualiser"
terms = ["joe", "whisper", "transcript", "datapoints", "segments", "endpointer", "piano roll",
         "microphone"]

[[projects.joe.checks]]
name = "tests"
says = "The test suite"
phrases = ["run the tests", "run the test suite", "run the suite", "test it"]
argv = ["uv", "run", "--frozen", "pytest", "tests/", "-q", "-p", "no:cacheprovider"]
minutes = 5

[[projects.joe.checks]]
name = "devices"
says = "The microphones joe can see, without recording from any"
phrases = ["list the microphones", "which microphones", "list the devices", "show the devices"]
argv = ["uv", "run", "--frozen", "joe", "voice", "devices"]
said = "^\\* \\["
minutes = 2

[projects.vox]
says = "The seam between a dialog and a speech engine"
terms = ["vox", "contract", "engine", "walkthrough", "mutations", "closed loop", "voice"]

[[projects.vox.checks]]
name = "tests"
says = "The test suite"
phrases = ["run the tests", "run the test suite", "run the suite", "test it"]
argv = ["uv", "run", "--frozen", "--extra", "dev", "pytest", "-q", "-p", "no:cacheprovider"]
minutes = 5

[[projects.vox.checks]]
name = "loop"
says = "The closed loop, offline"
phrases = ["run the closed loop", "close the loop", "run the loop offline"]
argv = ["uv", "run", "--frozen", "vox", "loop", "--offline"]
minutes = 2

[projects.qm]
says = "The constitution every project adopts"
terms = ["qm", "governance", "handoff", "records", "gates", "estate", "preflight", "leaks"]

[[projects.qm.checks]]
name = "gates"
says = "Whether the gates page matches the document it is rendered from"
phrases = ["check the gates", "are the gates current", "check the gates page"]
argv = ["uv", "run", "--frozen", "qm", "gates", "--check", "handbook/gates.md"]
minutes = 2

[[projects.qm.checks]]
name = "estate"
says = "What is in flight across every rostered repository"
phrases = ["check the estate", "show the estate", "whats in flight"]
argv = ["uv", "run", "--frozen", "qm", "estate"]
said = "repositories named"
minutes = 5

[[projects.qm.checks]]
name = "leaks"
says = "The scan for anything of a workstation in tracked files"
phrases = ["check for leaks", "run the leak check", "scan for leaks"]
argv = ["uv", "run", "--frozen", "qm", "leaks"]
said = "^(clean|found) "
minutes = 2
