[project]
name = "qmcp"
version = "0.1.0"
description = "A spec-aligned Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "click>=8.3.1",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.0.2",
    "sqlmodel>=0.0.31",
    "structlog>=25.1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
qmcp = "qmcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]
flows = [
    "metaflow>=2.12.0",
    "pydantic-ai[openai]",
]
# PydanticAI integration - core agent framework
# Note: pydantic-ai bundles provider SDKs, install provider packages separately if needed
pydantic-ai = [
    "pydantic-ai>=0.1.0",
]
# Provider SDKs for model support
anthropic = [
    "pydantic-ai>=0.1.0",
    "anthropic>=0.40.0",
]
openai = [
    "pydantic-ai>=0.1.0",
    "openai>=1.50.0",
]
# The meta-MCP server in qmcp_mcp.py, which exposes this repo over MCP.
# Capped below 2.0: qmcp_mcp.py imports mcp.server.fastmcp.FastMCP, and 2.x
# removed it — the name appears nowhere in that distribution.
mcp = [
    "mcp>=1.0.0,<2",
]
all-providers = [
    "pydantic-ai>=0.1.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "asyncio: marks tests as async (handled by pytest-asyncio)",
    "integration: marks tests that require external services (Ollama, live MCP server, etc.) - skipped by default in CI",
    "slow: marks tests that are intentionally slow",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
