# The determinism half of the tag claim, which no seed file can provide.
#
# `records/DRAFT-version-tags-are-claims.md` §2: a `v*` tag asserts a human
# reviewed the change set, a human manually tested it against its real runtime,
# and *deterministic automated validation passed*. `tag-claims.yml` is a seed
# file copied verbatim and it checks the first two by reading the annotation.
# Its own header says it does not run the project's tests, because no seed file
# knows this project's test command, and that the capture is the project's
# release job to produce. This is that job.
#
# A separate file, because `tag-claims.yml` is copied verbatim so a fix to the
# shared rule reaches every project on its next pin bump; editing it here would
# fork it. Project-owned wiring goes in a project-owned file.
#
# The output is redirected, not piped: a pipe replaces the exit code with the
# last command's. `>` keeps pytest's status.
#
# It fails while the suite skips any test: §3 says a test that skips
# contributes nothing to the automated-validation claim, so a run with skips
# cannot support a tag.
#
# What this cannot do: establish that the suite is deterministic. It refuses a
# run that announces nondeterminism -- a skip, a rerun, a retry. A suite that
# is nondeterministic and silent about it passes here.

name: Tag determinism

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      # The sweep states are copied across the seam between qmcp and dossier,
      # and tests/test_sweep.py checks the copies agree. It looks for dossier
      # in the directories above it -- the repository root included -- and
      # skips where there is none, which a run that may not skip cannot afford.
      # dossier is public.
      - uses: actions/checkout@v4
        with:
          repository: quaternionmedia/dossier
          path: dossier

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Every extra, from the lock. Without them the tests that need metaflow,
      # mcp, openai or pydantic-ai skip, and a skip voids the claim.
      - name: Install through the lock, with every extra
        run: uv sync --all-extras --frozen

      - name: Validation passes, and says so without a skip
        run: |
          uv run pytest tests walkthrough -q > test-output.txt
          python governance/qm/project-seed/ci/check_tag_claims.py \
            --test-output test-output.txt

      # Kept whatever the outcome: the run is the evidence behind the claim the
      # tag makes, and a failed run is the more useful of the two to read.
      - name: Keep the captured run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-determinism-run
          path: test-output.txt
